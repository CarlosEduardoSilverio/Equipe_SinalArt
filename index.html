    <title>CardSinalArt</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            background: #ffffff;
            min-height: 100vh;
        }

        .container-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1200px;
            margin: 40px auto;
        }

        .card {
            box-sizing: border-box;
            width: 204px;
            padding: 10px;
            background: #0000ff;
            border: 2px solid rgba(0, 0, 0, 0.856);
            display: flex;
            flex-direction: column;
        }

        .foto {
            box-sizing: border-box;
            width: 100%;
            height: 200px;
            overflow: hidden;
            border: 2px solid #ffffff;
            background-color: #FAF8DF;
        }

        .foto img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cargo {
            padding-top: 8px;
            color: #ffffff;
            font-family: "Montserrat", sans-serif;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
        }

        .dados {
            display: flex;
            justify-content: center;
            padding-top: 12px;
            color: #ffffff;
            font-family: "Montserrat", sans-serif;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.2;
            text-align: center;
        }

        .infos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .infos .icones {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .infos a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .infos a:hover {
            transform: scale(1.2);
        }

        .infos img {
            display: block;
            width: 30px;
            height: 30px;
            object-fit: contain;
            margin-top: 15px;
        }

        .egresso {
            display: block;
            margin-top: auto;
            padding-top: 8px;
            color: #ffffff;
            font-family: "Montserrat", sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
